<main id="container-principal">
  <h1>Cadastro de Cidades e Eleitores</h1>

  <!-- Formulário de Entrada -->
  <section class="card-formulario">
    <h2>Cadastrar Nova Cidade</h2>
    
    <div class="campo">
      <label for="nomeCidade">Nome da Cidade</label>
      <input 
        type="text" 
        id="nomeCidade" 
        [(ngModel)]="nomeCidade" 
        placeholder="Ex: Aracaju"
      >
    </div>

    <div class="campo">
      <label for="quantidadeEleitores">Número de Eleitores</label>
      <input 
        type="number" 
        id="quantidadeEleitores" 
        [(ngModel)]="quantidadeEleitores" 
        placeholder="Ex: 50000"
      >
    </div>

    <button (click)="adicionarCidade()">Cadastrar Cidade</button>
  </section>
  <!-- Tabela de Listagem -->
  <section class="card-tabela">
    <h2>Cidades Cadastradas</h2>

    @if (cidades.length === 0) {
      <p class="mensagem-vazia">Nenhuma cidade cadastrada ainda.</p>
    } @else {
      <table>
        <thead>
          <tr>
            <th>Cidade</th>
            <th>Nº de Eleitores</th>
          </tr>
        </thead>
        <tbody>
          @for (cidade of cidades; track cidade.nome) {
            <tr>
              <td>{{ cidade.nome }}</td>
              <td>{{ cidade.eleitores }}</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </section>
</main>
